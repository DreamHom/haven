name: Deploy to EKS

on:
  workflow_dispatch:

concurrency:
  group: deploy-eks-main
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  HAVEN_PHOTOS_R2_ENDPOINT: ${{ vars.HAVEN_PHOTOS_R2_ENDPOINT }}
  HAVEN_PHOTOS_R2_PUBLIC_BASE_URL: ${{ vars.HAVEN_PHOTOS_R2_PUBLIC_BASE_URL }}
  K8S_NAMESPACE: haven
  K8S_DEPLOYMENT: haven-api
  K8S_CONTAINER: haven-api
  K8S_KAFKA_DEPLOYMENT: haven-kafka

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B -ntp verify

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Create or update Kubernetes secret
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_FULL_NAME: ${{ secrets.ADMIN_FULL_NAME }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          HAVEN_JWT_PRIVATE_KEY: ${{ secrets.HAVEN_JWT_PRIVATE_KEY }}
          HAVEN_JWT_PUBLIC_KEY: ${{ secrets.HAVEN_JWT_PUBLIC_KEY }}
          HAVEN_PHOTOS_R2_ACCESS_KEY_ID: ${{ secrets.HAVEN_PHOTOS_R2_ACCESS_KEY_ID }}
          HAVEN_PHOTOS_R2_SECRET_ACCESS_KEY: ${{ secrets.HAVEN_PHOTOS_R2_SECRET_ACCESS_KEY }}
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl -n "$K8S_NAMESPACE" create secret generic haven-secrets \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=ADMIN_EMAIL="$ADMIN_EMAIL" \
            --from-literal=ADMIN_FULL_NAME="$ADMIN_FULL_NAME" \
            --from-literal=ADMIN_PASSWORD_HASH="$ADMIN_PASSWORD_HASH" \
            --from-literal=HAVEN_JWT_PRIVATE_KEY="$HAVEN_JWT_PRIVATE_KEY" \
            --from-literal=HAVEN_JWT_PUBLIC_KEY="$HAVEN_JWT_PUBLIC_KEY" \
            --from-literal=HAVEN_PHOTOS_R2_ACCESS_KEY_ID="$HAVEN_PHOTOS_R2_ACCESS_KEY_ID" \
            --from-literal=HAVEN_PHOTOS_R2_SECRET_ACCESS_KEY="$HAVEN_PHOTOS_R2_SECRET_ACCESS_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl -n "$K8S_NAMESPACE" patch configmap haven-config --type merge -p "{\"data\":{\"HAVEN_PHOTOS_R2_ENDPOINT\":\"$HAVEN_PHOTOS_R2_ENDPOINT\",\"HAVEN_PHOTOS_R2_PUBLIC_BASE_URL\":\"$HAVEN_PHOTOS_R2_PUBLIC_BASE_URL\"}}"
          kubectl apply -f k8s/kafka.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Set deployment image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl -n "$K8S_NAMESPACE" set image deployment/"$K8S_DEPLOYMENT" \
            "$K8S_CONTAINER"="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Wait for rollout
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/"$K8S_KAFKA_DEPLOYMENT" --timeout=180s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/"$K8S_DEPLOYMENT" --timeout=300s