name: Deploy to EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-ec2-main
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  SSM_ENV_PARAMETER: ${{ vars.SSM_ENV_PARAMETER }}
  EC2_APP_DIR: /opt/haven

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B -ntp verify

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push app image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -f Dockerfile.app -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Prepare SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/haven_ec2
          chmod 600 ~/.ssh/haven_ec2
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload compose file
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/haven_ec2 "$EC2_USER@$EC2_HOST" "sudo mkdir -p $EC2_APP_DIR && sudo chown $EC2_USER:$EC2_USER $EC2_APP_DIR"
          scp -i ~/.ssh/haven_ec2 deploy/ec2/docker-compose.yml "$EC2_USER@$EC2_HOST:$EC2_APP_DIR/docker-compose.yml"

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_URI: ${{ env.IMAGE_URI }}
          AWS_REGION: ${{ env.AWS_REGION }}
          SSM_ENV_PARAMETER: ${{ env.SSM_ENV_PARAMETER }}
        run: |
          ssh -i ~/.ssh/haven_ec2 "$EC2_USER@$EC2_HOST" \
            "set -e
             cd $EC2_APP_DIR
             PARAMETER_NAME='${SSM_ENV_PARAMETER:-/haven/production/env}'
             aws ssm get-parameter --name \"\$PARAMETER_NAME\" --with-decryption --query Parameter.Value --output text > .env
             chmod 600 .env
             aws ecr get-login-password --region '$AWS_REGION' | docker login --username AWS --password-stdin '${IMAGE_URI%%/*}'
             IMAGE_URI='$IMAGE_URI' docker compose pull app
             IMAGE_URI='$IMAGE_URI' docker compose up -d app
             docker image prune -f
             sleep 10
             curl -fsS http://localhost:8080/actuator/health"
