name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

# Single concurrency group per branch + workflow — newer pushes cancel older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: mvn verify (JDK 21, Postgres + Kafka via Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          # Built-in Maven cache — keys on pom.xml hash, restored across builds.
          cache: maven

      - name: Run unit + integration tests
        # ITs spin up Testcontainers Postgres + spring-kafka EmbeddedKafka. Docker is
        # pre-installed on ubuntu-latest, so no extra setup required.
        # AbstractPostgresIT registers HAVEN_JWT_*, ADMIN_*, CORS, jwt issuer/audience/exp
        # via @DynamicPropertySource — no CI-side env vars needed.
        run: mvn -B -ntp verify

      - name: Upload surefire + failsafe reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
