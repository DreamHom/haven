apiVersion: v1
kind: ConfigMap
metadata:
  name: haven-config
  namespace: haven
data:
  SPRING_PROFILES_ACTIVE: prod
  SERVER_PORT: "8080"
  DB_HOST: "your-rds-endpoint"
  DB_PORT: "5432"
  DB_NAME: "dreamhomes_haven"
  DB_USERNAME: "haven_app"
  KAFKA_BOOTSTRAP_SERVERS: "your-msk-bootstrap:9092"
  CORS_ALLOWED_ORIGINS: "https://your-frontend-domain.com"
  HAVEN_ERRORS_TYPE_BASE: "https://github.com/DreamHom/haven/blob/main/docs/errors/"
  HAVEN_KAFKA_TOPIC_PARTITIONS: "3"
  HAVEN_KAFKA_REPLICATION_FACTOR: "3"
  HAVEN_PHOTOS_STORAGE: "local"
  HAVEN_PHOTOS_R2_ENDPOINT: ""
  HAVEN_PHOTOS_R2_ACCESS_KEY_ID: ""
  HAVEN_PHOTOS_R2_BUCKET: ""
  HAVEN_PHOTOS_R2_PUBLIC_BASE_URL: ""
