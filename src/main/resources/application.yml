spring:
  application:
    name: dreamhomes-haven
  datasource:
    # Host port defaults to 5433 (see docker-compose.yml — host 5432 is taken locally).
    # Override with DB_PORT if you remap the compose stack.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:dreamhomes_haven}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: 8080

jwt:
  # No default — missing JWT_SECRET must fail Spring property resolution at startup,
  # not silently fall back to a known value. Set it explicitly in every environment.
  secret: ${JWT_SECRET}
  expiration-ms: 3600000
  issuer: dreamhomes-haven
  audience: dreamhomes

cors:
  # Comma-separated list of origins allowed to call the API. Vista's dev server runs
  # on :3000 by default; override via CORS_ALLOWED_ORIGINS in non-dev environments.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
