services:
  postgres:
    # pgvector required by Flyway V38+ (listing embeddings). Matches Testcontainers image in ITs.
    image: pgvector/pgvector:pg16
    container_name: haven-postgres
    environment:
      POSTGRES_DB: dreamhomes_haven
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Host port 5433 (5432 is taken by another local project).
      # Inside the container Postgres still listens on 5432.
      - "5433:5432"
    volumes:
      - haven-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dreamhomes_haven"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.0
    container_name: haven-kafka
    ports:
      # External listener on host:9092 (host-based `mvn spring-boot:run`).
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two PLAINTEXT listeners:
      #   - EXTERNAL :9092 — advertises localhost so a host-side `mvn spring-boot:run`
      #     can reach the broker via the published port.
      #   - INTERNAL :29092 — advertises `kafka` (compose service DNS) so the
      #     `app` container reaches the broker over the docker network.
      # Inter-broker traffic uses INTERNAL.
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    # Optional service — `docker compose up` brings up the full stack
    # (app + Postgres + Kafka) so an evaluator can hit http://localhost:8080
    # without installing Java + Maven locally. Local dev still uses
    # `mvn spring-boot:run` for hot reload.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: haven-app
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Postgres reachable on the docker network at hostname `postgres:5432`
      # (the in-container port, not the published 5433 host port).
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: dreamhomes_haven
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # Kafka via the INTERNAL advertised listener (see kafka service above).
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Read from your host shell / .env. Fail-fast at startup if missing
      # (Spring property resolution refuses to boot with unresolved placeholders).
      HAVEN_JWT_PRIVATE_KEY: ${HAVEN_JWT_PRIVATE_KEY:?HAVEN_JWT_PRIVATE_KEY must be set (PEM, multi-line)}
      HAVEN_JWT_PUBLIC_KEY: ${HAVEN_JWT_PUBLIC_KEY:?HAVEN_JWT_PUBLIC_KEY must be set (PEM, multi-line)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL must be set}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH must be set (bcrypt-10)}
      # CORS — frontend dev server origin. Override per environment.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Photo storage: leave as `local` unless you've populated R2 credentials.
      HAVEN_PHOTOS_STORAGE: ${HAVEN_PHOTOS_STORAGE:-local}
    restart: unless-stopped

volumes:
  haven-postgres-data:
